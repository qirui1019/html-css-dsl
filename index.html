<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEESII Instruction Manual - Cover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="page page--cover" data-page-type="coverPage">

    <!-- 封面主模块 -->
    <div class="module cover-hero" data-module-type="coverHero">

      <!-- 品牌 Logo -->
      <div class="element brand-logo" data-element-type="brandLogo" data-bind="cover.brandLogo">
        SEESII POWER TOOLS
      </div>

      <!-- 产品名称 -->
      <h1 class="element product-name" data-element-type="productName" data-bind="cover.productName">
        Automatic Submersible Water Pump
      </h1>

      <!-- 说明书类型 -->
      <h2 class="element manual-type" data-element-type="manualType" data-bind="cover.manualType">
        INSTRUCTION MANUAL
      </h2>

      <!-- 重要提示 -->
      <div class="element important-note" data-element-type="importantNote" data-bind="cover.importantNote">
        <strong>IMPORTANT NOTE:</strong>
        <p>1. Please read these instructions carefully before use.</p>
        <p>2. After-sales Support Email: support@seesiius.com</p>
      </div>

      <!-- 产品图占位 -->
      <div class="element product-image-placeholder" data-element-type="productImage" data-bind="cover.productImage">
        产品主图占位
      </div>

    </div>

    <!-- 底部信息条 -->
    <div class="module cover-bottom-bar" data-module-type="coverBottomBar">
      <div class="element model-text" data-element-type="model" data-bind="cover.model">
        BCP75020
      </div>
      <div class="element support-email" data-element-type="supportEmail" data-bind="cover.supportEmail">
        support@seesiius.com
      </div>
    </div>

  </section>
</body>
</html>
