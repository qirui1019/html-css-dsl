SEESII说明书页面结构:
  - 全局版式:
      - 纸张尺寸: "A5(210*148mm)"
      - 纸张方向: "竖向"
      - 页边距: "T/B/R/L: 10mm"
      - 一级标题字体: "Orbit ron"
      - 二级标题字体: "Orbit ron"
      - 三级标题字体: "New Frank Bold"
      - 正文字体: "New Frank"
      - 一级标题字号: "15pt"
      - 二级标题字号: "12pt"
      - 三级标题字号: "11pt"
      - 正文字号: "10pt"
      - 主标题字号范围: "最大字号32pt,最小字号21pt(双排使用)"
      - 副标题字号范围: "最大字号17pt,最小字号15pt"
      - 目录正文行间距: "根据目录行数可在12pt-21pt之间调整"
      - 正文行间距: "根据内容量和排版效果可在11pt-15pt之间调整，建议为12.5pt"
      - 多语言说明书: "对于多语言说明书，不同语言对应说明书的页面顺序和英文说明书页面顺序保持一致"

  - 页面名称: "封面"
    页面类型: "封面页"
    页面说明: "SEESII说明书封面页面"
    页面级layout:
      - 隐形规则: "封面页面的模块和元素位置关系、字体字号等视觉设计参数固定不变，但具体内容（如标题文本、图片内容等）会根据不同产品进行调整"
      - 参数: "暂无补充"
    页面顺序: "1"

    包含模块:
      - 模块名称: "封面背景装饰模块"
        模块类型: "背景装饰模块"
        模块说明: "用于描述封面中的灰底区域、斜切背景块、箭头纹理等非内容型视觉装饰"
        包含元素:
          - 元素名称: "顶部灰底斜切背景"
            元素类型: "图片"
            元素用途: "承载封面顶部品牌、标题和重要提示区域的视觉背景"
            layout:
              - 位置描述: "位于页面顶部，左侧和上侧分别和页面边缘对齐，右侧和页面边缘有一定边距，右侧和下侧位置随内容量自适应调整"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "固定有，可拉伸适应不同内容量"

          - 元素名称: "底部灰底信息条"
            元素类型: "图片"
            元素用途: "承载型号和售后邮箱等底部辅助信息"
            layout:
              - 位置描述: "位于页面底部，右侧和下侧分别和页面边缘对齐，左侧和上侧位置随内容量自适应调整"
              - 参数: "高度: 10mm; 宽度:自适应内容量"
              - 是否固定: "固定有，可拉伸适应不同内容量"

          - 元素名称: "左下角箭头纹理"
            元素类型: "装饰图形"
            元素用途: "增强封面视觉层次和品牌风格"
            layout:
              - 位置描述: "位于页面左下角，与页面边缘距离固定"
              - 参数: "以最小箭头为基准，箭头左侧顶点处距离页面左侧10mm，距离页面底侧10mm"
              - 是否固定: "固定有，值不变"

      - 模块名称: "封面主视觉模块"
        模块类型: "主视觉模块"
        模块说明: "用于承载品牌、产品、说明书名称、产品主图和型号等封面核心信息"
        包含元素:
          - 元素名称: "品牌logo"
            元素类型: "图片"
            元素用途: "展示品牌logo"
            layout:
              - 位置描述: "位于封面背景装饰模块中的顶部灰底斜切背景内"
              - 参数: "距离页面左侧: 10mm；距离页面顶侧:10mm; 宽度: 50mm"
              - 是否固定: "固定有，值不变"

          - 元素名称: "产品名"
            元素类型: "文本框"
            元素用途: "展示说明书主标题或产品名称"
            layout:
              - 位置描述: "位于封面背景装饰模块中的顶部灰底斜切背景内，品牌logo下方"
              - 参数: "字体字号: Orbitron Black 32pt"
              - 是否固定: "固定有，值会变"

          - 元素名称: "说明书类型"
            元素类型: "文本框"
            元素用途: "展示说明书类型或副标题"
            layout:
              - 位置描述: "位于封面背景装饰模块中的顶部灰底斜切背景内，产品名下方"
              - 参数: "字体字号: Orbitron Bold 18pt"
              - 是否固定: "固定有"

          - 元素名称: "分隔线"
            元素类型: "装饰线"
            元素用途: "分隔封面不同信息区域"
            layout:
              - 位置描述: "位于封面背景装饰模块中的顶部灰底斜切背景内，说明书类型下方"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "固定有"

          - 元素名称: "重要提示"
            元素类型: "文本框"
            元素用途: "展示封面安全阅读提示"
            layout:
              - 位置描述: "位于封面背景装饰模块中的顶部灰底斜切背景内，分隔线下方"
              - 参数: "标题: New Frank Bold 13pt； 文本：New Frank Regular 10pt"
              - 是否固定: "固定有，值会变"

          - 元素名称: "产品主图"
            元素类型: "图片占位符"
            元素用途: "展示产品主图或预留产品图片位置"
            layout:
              - 位置描述: "位于封面背景装饰模块中的顶部灰底斜切背景下方、底部灰底信息条上方，水平居中"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "固定有，值会变"

      - 模块名称: "封面辅助信息模块"
        模块类型: "信息模块"
        模块说明: "用于承载封面上的型号、重要提示、售后邮箱等辅助信息"
        包含元素:
          - 元素名称: "产品型号"
            元素类型: "文本框"
            元素用途: "展示产品型号"
            layout:
              - 位置描述: "位于封面背景装饰模块中的底部灰底信息条内，左侧"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "固定有，值会变"

          - 元素名称: "售后邮箱"
            元素类型: "文本框"
            元素用途: "展示售后联系方式"
            layout:
              - 位置描述: "位于封面背景装饰模块中的底部灰底信息条内，右侧"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "固定有，值会变"

  - 页面名称: "多语言说明书目录"
    页面类型: "目录页"
    页面说明: "用于展示不同语言说明书起止页码信息，帮助用户快速定位不同语言说明书内容"
    是否固定: "可选，值变"
    页面级layout:
      - 隐形规则: "<待和开发、设计确认参数>"
      - 参数: "<待和开发、设计确认参数>"
    页面顺序: "2"

    包含模块:
      - 模块名称: "页眉品牌信息模块"
        模块类型: "页眉模块"
        模块说明: "用于承载页面顶部的品牌标识、售后邮箱和右侧箭头装饰"
        包含元素:
          - 元素名称: "品牌logo"
            元素类型: "图片"
            元素用途: "展示品牌logo"
            layout:
              - 位置描述: "<待和开发、设计确认参数>"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "<待和开发、设计确认参数>"

          - 元素名称: "页眉售后邮箱"
            元素类型: "文本框"
            元素用途: "展示售后联系方式"
            layout:
              - 位置描述: "<待和开发、设计确认参数>"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "<待和开发、设计确认参数>"

          - 元素名称: "分隔线"
            元素类型: "装饰线"
            元素用途: "增强页眉视觉识别和品牌风格"
            layout:
              - 位置描述: "<待和开发、设计确认参数>"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "<待和开发、设计确认参数>"

      - 模块名称: "目录列表模块"
        模块类型: "目录模块"
        模块说明: "用于展示不同语言说明书对应页码"
        包含元素:
          - 元素名称: "目录项"
            元素类型: "目录文本"
            元素用途: "展示主要章节标题"
            layout:
              - 位置描述: "<待和开发、设计确认参数>"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "<待和开发、设计确认参数>"

          - 元素名称: "目录引导线"
            元素类型: "装饰线"
            元素用途: "连接目录标题与页码，提升阅读定位效率"
            layout:
              - 位置描述: "<待和开发、设计确认参数>"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "<待和开发、设计确认参数>"

          - 元素名称: "目录页码"
            元素类型: "页码文本"
            元素用途: "展示章节对应页码"
            layout:
              - 位置描述: "<待和开发、设计确认参数>"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "<待和开发、设计确认参数>"

          - 元素名称: "目录项背景框"
            元素类型: "图片"
            元素用途: "突出目录项信息，提升视觉识别度"
            layout:
              - 位置描述: "<待和开发、设计确认参数>"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "<待和开发、设计确认参数>"

  - 页面名称: "目录"
    页面类型: "目录页"
    页面说明: "用于展示说明书章节目录、子章节标题及对应页码，帮助用户快速定位内容"
    是否固定: "固定有，值会变"
    页面级layout:
      - 隐形规则: "目录页面的一级目录项根据正文一级标题内容自动填充，二级目录项根据正文二级标题内容自动填充；目录正文行间距可根据目录行数在12pt-21pt范围内自动调整，目录如需翻页，第二页和第一页页面格式完全一致"
      - 参数: "暂无补充"
    页面顺序: "3"

    包含模块:
      - 模块名称: "页眉品牌信息模块"
        模块类型: "页眉模块"
        模块说明: "用于承载页面顶部的品牌标识、售后邮箱和右侧箭头装饰"
        包含元素:
          - 元素名称: "品牌logo"
            元素类型: "图片"
            元素用途: "展示品牌logo"
            layout:
              - 位置描述: "位于页眉品牌信息模块中的页眉灰底信息条内，左侧"
              - 参数: "距离页面左侧: 10mm； 宽度: 20mm"
              - 是否固定: "固定有，值不变"

          - 元素名称: "页眉售后邮箱"
            元素类型: "文本框"
            元素用途: "展示售后联系方式"
            layout:
              - 位置描述: "位于页眉品牌信息模块中的页眉灰底信息条内，右对齐"
              - 参数: "字体字号：New Frank Bold 10pt"
              - 是否固定: "固定有，值会变"

          - 元素名称: "右上角箭头装饰"
            元素类型: "装饰图形"
            元素用途: "增强页眉视觉识别和品牌风格"
            layout:
              - 位置描述: "位于页眉品牌信息模块中的页眉灰底信息条内，右侧，与售后邮箱右侧保持一定距离"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "固定有，值不变"

          - 元素名称: "页眉灰底信息条"
            元素类型: "图片"
            元素用途: "承载页眉品牌、邮箱及装饰元素"
            layout:
              - 位置描述: "位于页面顶部，左侧与页面边缘对齐，上侧和右侧与页面边缘有一定距离"
              - 参数: "距离页面右侧: 10mm"
              - 是否固定: "固定有，值不变"

      - 模块名称: "目录标题模块"
        模块类型: "标题模块"
        模块说明: "用于展示目录页主标题"
        包含元素:
          - 元素名称: "目录标题"
            元素类型: "文本框"
            元素用途: "展示目录页标题"
            layout:
              - 位置描述: "位于页面背景装饰模块中的目录页浅灰背景顶部"
              - 参数: "字体字号：Orbitron Black 18pt"
              - 是否固定: "固定有，值不变"

      - 模块名称: "目录列表模块"
        模块类型: "目录模块"
        模块说明: "用于展示一级章节、二级章节和对应页码"
        包含元素:
          - 元素名称: "一级目录项"
            元素类型: "目录文本"
            元素用途: "展示主要章节标题"
            layout:
              - 位置描述: "位于目录标题模块下方，作为目录列表的第一层级"
              - 参数: "字体字号：与正文一级标题保持一致"
              - 是否固定: "固定有，值会变"

          - 元素名称: "二级目录项"
            元素类型: "目录文本"
            元素用途: "展示主要章节下的子章节标题"
            layout:
              - 位置描述: "位于一级目录项下方，作为目录列表的第二层级"
              - 参数: "字体字号：与正文二级标题保持一致"
              - 是否固定: "固定有，值会变"

          - 元素名称: "目录引导线"
            元素类型: "装饰线"
            元素用途: "连接目录标题与页码，提升阅读定位效率"
            layout:
              - 位置描述: "位于目录项和目录页码之间，水平延伸连接两者"
              - 参数: "<待和开发、设计确认参数>（精度不用很高）"
              - 是否固定: "固定有，值会变"

          - 元素名称: "目录页码"
            元素类型: "页码文本"
            元素用途: "展示章节对应页码"
            layout:
              - 位置描述: "位于目录项的右侧，与目录引导线连接，右对齐"
              - 参数: "<待和开发、设计确认参数>"
              - 是否固定: "固定有，值会变"

      - 模块名称: "页面背景装饰模块"
        模块类型: "背景装饰模块"
        模块说明: "用于描述目录页中的浅灰背景区域和页面底部斜切装饰"
        包含元素:
          - 元素名称: "目录页浅灰背景"
            元素类型: "图片"
            元素用途: "形成目录内容区域的视觉底色"
            layout:
              - 位置描述: "位于页眉品牌信息模块下方，左侧和页面边缘对齐，右侧和下侧与页面边缘有一定距离"
              - 参数: "下侧距离页面边缘: 10mm，右侧距离页面边缘: 10mm"
              - 是否固定: "固定有，值不变"

  - 页面名称: "普通章节"
    页面类型: "普通章节页"
    页面说明: "用于承载产品正文章节相关内容，包括章节标题、小节标题、警告提示和正文说明"
    是否固定: "固定有，值会变"
    页面级layout:
      - 隐形规则: "普通章节页面的模块和元素位置关系固定不变，但具体内容（如标题文本、图片内容等）会根据不同章节内容进行调整；如果某些模块（如安全警告提示模块、基础表格模块等）在某些章节不需要展示，可以选择隐藏该模块，但其他模块和元素的布局关系保持不变"
      - 参数:
          "一级标题与后面的正文、表格、警示框间距：5mm；一级标题与前一模块间距：10mm；
          二级标题和后面的模块间距：4mm；二级标题和前面的模块间距：8mm；
          正文说明模块、安全警告提示模块、基础表格模块、图片占位符模块不同模块之间的间距：4mm；
          文本和图片为注释/演绎关系的作为不可分割组合间距单独设置，文本和示意图间距：3mm，两个组合之间间距：6mm"
    页面顺序: "4"

    包含模块:
      - 模块名称: "一级标题模块"
        模块类型: "标题模块"
        模块说明: "用于展示章节的主标题"
        包含元素:
          - 元素名称: "一级标题背景框"
            元素类型: "图片"
            元素用途: "突出章节标题，提升视觉识别度"
            layout:
              - 位置描述: "根据正文内容排版"
              - 参数: "高度: 10mm; 宽度:自适应内容量"
              - 是否固定: "固定有，值会变，可拉伸"

          - 元素名称: "一级标题"
            元素类型: "标题文本"
            元素用途: "展示章节主标题"
            layout:
              - 位置描述: "位于一级标题背景框内"
              - 参数: "字体字号：Orbitron Bold 15pt"
              - 是否固定: "固定有，值会变"

      - 模块名称: "二级标题模块"
        模块类型: "标题模块"
        模块说明: "用于展示章节下的分组标题"
        包含元素:
          - 元素名称: "二级标题背景框"
            元素类型: "图片"
            元素用途: "突出章节下的分组标题，提升视觉层次感"
            layout:
              - 位置描述: "根据正文内容排版。如果位于一级标题背景框下方，则间距3mm"
              - 参数: "高度: 7mm; 宽度:自适应内容量"
              - 是否固定: "固定有，值会变，可拉伸"

          - 元素名称: "二级标题"
            元素类型: "标题文本"
            元素用途: "展示章节下的分组标题"
            layout:
              - 位置描述: "位于二级标题背景框内，作为章节的第二层级标题"
              - 参数: "字体字号：Orbitron Bold 12pt"
              - 是否固定: "固定有，值会变"

      - 模块名称: "正文说明模块"
